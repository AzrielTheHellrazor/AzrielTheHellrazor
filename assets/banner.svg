<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mehmet Göktuğ Karoğlu — DeFi, Smart Contracts & AI Financial Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="60" x2="720" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="15" stroke="#1E293B" stroke-width="1.5"/>

  <circle cx="1020" cy="70" r="140" fill="#38BDF8" opacity="0.07"/>
  <circle cx="220" cy="240" r="130" fill="#34D399" opacity="0.06"/>

  <rect x="64" y="68" width="56" height="4" rx="2" fill="url(#accent)"/>

  <text x="64" y="114" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.8">
    Mehmet Göktuğ Karoğlu
  </text>
  <text x="64" y="152" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="400">
    Non-custodial DeFi Primitives · Smart Contracts · AI Financial Automation
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">
    <rect x="64" y="186" width="126" height="32" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="127" y="207" fill="#38BDF8" text-anchor="middle">Rust / Soroban</text>

    <rect x="202" y="186" width="136" height="32" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="270" y="207" fill="#818CF8" text-anchor="middle">Solidity / EVM</text>

    <rect x="350" y="186" width="150" height="32" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="425" y="207" fill="#34D399" text-anchor="middle">TypeScript / Bun</text>

    <rect x="512" y="186" width="110" height="32" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="567" y="207" fill="#FBBF24" text-anchor="middle">Python / AI</text>
  </g>

  <text x="1128" y="162" fill="#1E293B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="92" font-weight="800" text-anchor="end">
